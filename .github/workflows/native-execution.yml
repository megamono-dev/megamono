name: Native execution qualification
on:
  pull_request:
    paths:
      [
        'packages/nx-cargo/**',
        'packages/plugin/src/generators/app/**',
        'packages/plugin/e2e/android.e2e.mjs',
        'packages/plugin/package.json',
        '.github/workflows/native-execution.yml',
        'package-lock.json',
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MEGAMONO_ANDROID_NATIVE_E2E: 'true'
      NX_DAEMON: 'false'
      NX_ISOLATE_PLUGINS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Use the repository npm version
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npm exec nx -- run @megamono/plugin:e2e-android
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: rustup component add clippy
      - name: Use the repository npm version
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npm exec nx -- run nx-cargo:e2e-native-execution
