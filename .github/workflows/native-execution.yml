name: Native execution qualification
on:
  pull_request:
    paths:
      [
        'packages/nx-cargo/**',
        '.github/workflows/native-execution.yml',
        'package-lock.json',
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: rustup component add clippy
      - run: npm ci
      - run: npm exec nx -- run nx-cargo:e2e-native-execution
