name: Release qualification

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: megamono-release-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install 'git-filter-repo>=2.47,<3'
      - name: Use the repository npm version
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - name: Verify publishing environment protections
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:check-publishing
      - name: Qualify release packages
        shell: bash
        run: |
          mkdir -p tmp/release-qualification
          npm run release:qualify 2>&1 | tee tmp/release-qualification/qualification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qualification-log
          path: tmp/release-qualification/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prismark-consumer-qualification
          path: tmp/prismark-consumer/
          if-no-files-found: ignore
