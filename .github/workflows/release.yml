name: Release npm packages

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm distribution channel
        required: true
        default: next
        type: choice
        options:
          - next
          - latest
      specifier:
        description: Optional exact version or channel-compatible semver keyword
        required: false
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: megamono-npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 120
    environment: npm-${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install 'git-filter-repo>=2.47,<3'
      - name: Use the repository npm version
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - name: Require an OIDC-capable npm CLI
        run: |
          npm_version="$(npm --version)"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) { throw new Error("npm 11.5.1 or newer is required for trusted publishing"); }' "$npm_version"
      - name: Resolve and validate release channel
        id: release
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_SPECIFIER: ${{ inputs.specifier }}
        run: node tools/resolve-release-channel.mjs
      - run: npm run release:check
      - run: npm run release:test
      - name: Verify publishing environment protections
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:check-publishing
      - name: Verify tested next versions before stable promotion
        if: inputs.channel == 'latest'
        run: node tools/check-next-promotion.mjs
      - name: Preview version changes
        env:
          FIRST_RELEASE: ${{ steps.release.outputs.first_release }}
          PREID: ${{ steps.release.outputs.preid }}
          SPECIFIER: ${{ steps.release.outputs.specifier }}
        run: |
          args=(release version "$SPECIFIER" --groups=megamono,create-megamono --dry-run)
          if [ -n "$PREID" ]; then args+=(--preid "$PREID"); fi
          if [ "$FIRST_RELEASE" = "true" ]; then args+=(--first-release); fi
          npm exec nx -- "${args[@]}"
      - name: Qualify release packages
        shell: bash
        run: |
          mkdir -p tmp/release-qualification
          npm run release:qualify 2>&1 | tee tmp/release-qualification/qualification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qualification-log
          path: tmp/release-qualification/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prismark-consumer-qualification
          path: tmp/prismark-consumer/
          if-no-files-found: ignore
      - name: Require a clean release checkout
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short
            exit 1
          fi
      - name: Configure release commit identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Version and tag packages
        env:
          FIRST_RELEASE: ${{ steps.release.outputs.first_release }}
          PREID: ${{ steps.release.outputs.preid }}
          SPECIFIER: ${{ steps.release.outputs.specifier }}
        run: |
          args=(release version "$SPECIFIER" --groups=megamono,create-megamono --git-commit=false --git-tag=false)
          if [ -n "$PREID" ]; then args+=(--preid "$PREID"); fi
          if [ "$FIRST_RELEASE" = "true" ]; then args+=(--first-release); fi
          npm exec nx -- "${args[@]}"
          node tools/sync-release-pins.mjs
          npm exec nx -- run-many -t build
          npm run packages:check-exports
          node tools/commit-release.mjs
      - name: Publish public packages to npm
        id: publish
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          FIRST_RELEASE: ${{ steps.release.outputs.first_release }}
        run: |
          node tools/write-build-info.mjs
          args=(release publish --groups=megamono,create-megamono --tag "$DIST_TAG" --access public)
          if [ "$FIRST_RELEASE" = "true" ]; then args+=(--first-release); fi
          npm exec nx -- "${args[@]}"
      - name: Read released versions
        id: versions
        run: |
          echo "megamono=$(node -p "require('./packages/plugin/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "create=$(node -p "require('./packages/create-megamono/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Push release commit and tags
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: git push --follow-tags origin "HEAD:refs/heads/$RELEASE_BRANCH"
      - name: Create GitHub release
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
          CREATE_VERSION: ${{ steps.versions.outputs.create }}
          GH_TOKEN: ${{ github.token }}
          MEGAMONO_VERSION: ${{ steps.versions.outputs.megamono }}
        run: |
          tag="megamono@$MEGAMONO_VERSION"
          args=(release create "$tag" --verify-tag --generate-notes --title "Megamono $MEGAMONO_VERSION" --notes "Includes create-megamono@$CREATE_VERSION.")
          if [ "$CHANNEL" = "next" ]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh "${args[@]}"
